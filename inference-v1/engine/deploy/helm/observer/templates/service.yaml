apiVersion: v1
kind: Service
metadata:
  name: {{ include "observer.fullname" . }}
  labels:
    {{- include "observer.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: {{ include "observer.sessionAffinity" . }}
  selector:
    {{- include "observer.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.ports.http }}, targetPort: http, protocol: TCP}
    - {name: otlp-grpc, port: {{ .Values.service.ports.otlpGrpc }}, targetPort: otlp-grpc, protocol: TCP, appProtocol: grpc}
    - {name: otlp-http, port: {{ .Values.service.ports.otlpHttp }}, targetPort: otlp-http, protocol: TCP}
---
# One DNS record per engine pod, so the trace-routing gateway can hash each
# trace to a pod.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observer.fullname" . }}-pods
  labels:
    {{- include "observer.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "observer.selectorLabels" . | nindent 4 }}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc, protocol: TCP}
