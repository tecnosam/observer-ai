{{- if and .Values.nats.enabled .Values.networkPolicy.enabled }}
# The bundled NATS takes connections only from the engine's pods and from
# the other NATS servers (cluster routes).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "observer.fullname" . }}-nats
  labels:
    {{- include "observer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "observer.selectorLabels" . | nindent 14 }}
      ports:
        - {port: 4222, protocol: TCP}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
              app.kubernetes.io/instance: {{ .Release.Name }}
    {{- if .Values.autoscaling.queueDepth.enabled }}
    # KEDA reads the consumer lag from the monitoring endpoint.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.autoscaling.queueDepth.kedaNamespace }}
      ports:
        - {port: 8222, protocol: TCP}
    {{- end }}
{{- end }}
