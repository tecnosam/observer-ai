# yaml-language-server: $schema=./observer.schema.yaml
# Observer.ai inference engine configuration.
# Every key is optional except scorer.manifest; the values below are the defaults.
# observer.schema.yaml describes every key, its type, default and limits.

server:
  addr: ":8080"
  workers: 8             # concurrent workers pulling traces from the queue
  shutdown_timeout: 30s  # time allowed for in-flight traces on shutdown

# The work queue between the receivers and the workers, the span store and
# the export queues. With url empty they live in the engine's memory: nothing
# else to run, but queued work is lost on restart and engines cannot share
# it. Set url to keep them all in NATS JetStream.
queue:
  url: ""                           # env: OBSERVER_NATS_URL, e.g. nats://localhost:4222
  connect_timeout: 30s              # how long to wait for NATS at start-up
  stream: OBSERVER_TRACES
  subject: observer.traces
  consumer: observer-workers        # replicas sharing this name share the work
  max_messages: 100000              # queued traces before the API returns 503
  ack_wait: 2m                      # a worker's time limit per trace before redelivery
  # System errors (Kev down, timing out, 5xx): the trace is redelivered with
  # these delays, and dead-lettered after max_deliver attempts.
  max_deliver: 5
  redelivery_backoff: [5s, 30s, 2m, 5m]
  dlq_stream: OBSERVER_TRACES_DLQ
  dlq_subject: observer.traces.dlq
  dlq_max_age: 168h                 # how long dead letters are kept
  # Each exporter's queue on NATS: stream OBSERVER_EXPORTS_<NAME> on subject
  # observer.exports.<name>; traces an exporter gave up on go to the DLQ.
  export_stream: OBSERVER_EXPORTS
  export_subject: observer.exports
  export_dlq_stream: OBSERVER_EXPORTS_DLQ
  export_dlq_subject: observer.exports_dlq

# OpenTelemetry receivers. Spans are stored by trace ID, assembled
# into a trace once it goes quiet, then scored like any other trace.
otlp:
  grpc_addr: ":4317"                # env: OBSERVER_OTLP_GRPC_ADDR; "" turns gRPC off
  http_addr: ":4318"                # env: OBSERVER_OTLP_HTTP_ADDR; POST /v1/traces
  idle_timeout: 10s                 # no spans for this long: the trace is complete
  max_wait: 2m                      # assemble anyway this long after the first span
  assemblers: 4
  span_stream: OBSERVER_SPANS
  span_subject: observer.spans      # spans go to observer.spans.<trace id>
  span_max_age: 1h                  # spans never assembled are removed after this
  pending_stream: OBSERVER_PENDING
  pending_subject: observer.pending

scorer:
  kind: kev                                      # kev | jev (TypeSafe's hosted Jev; see ../examples/jev.yaml)
  # api_key_env: JEV_API_KEY                     # env var holding a bearer key; defaults to JEV_API_KEY for jev
  endpoint: http://localhost:8010/v1/systemone   # env: OBSERVER_SCORER_ENDPOINT
  model: kev-latest                              # model name sent to Kev
  # Relative paths resolve against this file's directory. env: OBSERVER_MANIFEST
  manifest: ../../finetune/notebooks/runs/observer-kev-0.8b-ft/manifest.json
  decision_question: answer_wrong
  timeout: 10s           # per attempt
  max_retries: 3         # in-process retries after the first attempt
  backoff: [500ms, 2s, 5s]

# One model per agent. The scorer section above is the default; each agent
# listed here gets its own model, stating only what differs from it.
agents:
  attributes: [agent.name, service.name]         # where a trace names its agent: root span, then resource
  # models:
  #   support-bot:
  #     model: kev-support
  #     manifest: runs/support-bot/manifest.json  # see ../examples/agents.yaml

policy:
  keep_threshold: 0.5
  random_floor: 0.02

alert:
  severity_high: 0.8

# Where the engine's own errors are written: stdout and/or a file, one JSON object per line.
observability:
  error_sinks:
    - kind: stdout
    # - kind: file
    #   path: /var/log/observer/errors.jsonl
  # The engine's own OpenTelemetry metrics (latencies, error rates, decisions).
  metrics:
    # endpoint: http://localhost:4318/v1/metrics  # OTLP/HTTP; unset means off
    # headers_env: METRICS_OTLP_HEADERS
    interval: 15s

# Where kept traces go: any number of OTLP/HTTP back ends, each sent every
# kept trace asynchronously from its own queue (in NATS when queue.url is
# set). OBSERVER_EXPORT_ENDPOINT replaces the first endpoint.
# ../examples/langfuse.yaml adds Langfuse.
exporters:
  - name: phoenix
    endpoint: http://localhost:6006/v1/traces
    resource_attributes:
      openinference.project.name: observer-ai     # the Phoenix project
    # headers: {x-team: observability}            # sent as written
    # headers_env: PHOENIX_OTLP_HEADERS           # "key=value,key2=value2" from the environment, for secrets
    # queue_size: 1024
    # concurrency: 4
    # max_deliver: 3                              # tries before giving up (dead-lettered on NATS)
    # backoff: [1s, 5s, 30s]                      # wait before each retry
