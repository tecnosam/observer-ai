# Runs the inference engine, its NATS JetStream queue and Phoenix.
#
#   docker compose up --build        # or: make up
#
# Kev is not part of this file. By default the engine reaches it on the
# Docker host (port 8010); override OBSERVER_SCORER_ENDPOINT to point
# elsewhere. To use a Phoenix outside compose instead of the one here, set
# OBSERVER_EXPORT_ENDPOINT and start only `nats` and `observer`.

name: observer

services:
  nats:
    image: nats:2.15-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      # Loopback only: this NATS has no authentication.
      - "127.0.0.1:4222:4222"   # clients, e.g. `make run` on the host
      - "127.0.0.1:8222:8222"   # monitoring: http://localhost:8222
    volumes:
      - nats-data:/data          # spans, queued traces and dead letters survive restarts
      - ./nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-20.21.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "${PHOENIX_PORT:-6006}:6006"        # UI (http://localhost:6006) and OTLP HTTP
      - "${PHOENIX_GRPC_PORT:-4317}:4317"   # OTLP gRPC, for agents that send straight to Phoenix
    volumes:
      - phoenix-data:/mnt/data   # projects and traces survive restarts
    restart: unless-stopped

  observer:
    build: .
    image: observer-engine:local
    depends_on:
      nats:
        condition: service_healthy
      phoenix:
        condition: service_started
    environment:
      OBSERVER_NATS_URL: nats://nats:4222
      OBSERVER_SCORER_ENDPOINT: ${OBSERVER_SCORER_ENDPOINT:-http://host.docker.internal:8010/v1/systemone}
      OBSERVER_EXPORT_ENDPOINT: ${OBSERVER_EXPORT_ENDPOINT:-http://phoenix:6006/v1/traces}   # the first exporter
    volumes:
      # The model manifest from the fine-tuning run. The image reads it from
      # /etc/observer/manifest.json (OBSERVER_MANIFEST).
      - ${OBSERVER_MANIFEST_FILE:-../../finetune/notebooks/runs/observer-kev-0.8b-ft/manifest.json}:/etc/observer/manifest.json:ro
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too.
      - "host.docker.internal:host-gateway"
    ports:
      - "${OBSERVER_PORT:-8080}:8080"             # JSON API and Swagger UI
      # OTLP gRPC. The container listens on 4317; the host port defaults to
      # 14317 because the phoenix service above takes 4317 for its own OTLP
      # gRPC receiver.
      - "${OBSERVER_OTLP_GRPC_PORT:-14317}:4317"
      - "${OBSERVER_OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP: POST /v1/traces
    # Enough time for in-flight traces (server.shutdown_timeout) and the
    # final export flush before Docker kills the process.
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  nats-data:
  phoenix-data:
