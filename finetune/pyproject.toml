[project]
name = "finetune"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "huggingface>=0.0.1",
    "huggingface-hub>=2.1.1",
    "jupyter>=1.1.1",
    "observer-agent",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "transformers>=5.19.0",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
# observer-agent needs litellm -> tokenizers, and tokenizers caps huggingface-hub
# below 2.0. This project needs huggingface-hub 2.x, so ignore that cap.
override-dependencies = ["huggingface-hub>=2.1.1"]

[tool.uv.sources]
observer-agent = { path = "testagents", editable = true }
